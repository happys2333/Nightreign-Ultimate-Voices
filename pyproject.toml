[project]
name = "nightreign-ultimate-voices"
version = "0.1.0"
description = "Offline native soundbank builder for local Nightreign ultimate voice callouts"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<51", "tomli-w>=1.2,<2"]

[project.scripts]
nuv = "nuv.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nuv*"]
